<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agente IA - Costos Operativos</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <main class="container">
        <section class="header">
            <h1>Agente IA de Costos Operativos</h1>
            <p>Consulta resultados del EDA, modelado predictivo y forecasting.</p>
        </section>

        <section class="examples">
            <button onclick="askExample('¿Cuál fue el mejor modelo de forecasting y por qué?')">
                Mejor modelo de forecasting
            </button>
            <button onclick="askExample('¿Qué materia prima afecta más al Equipo 1?')">
                Materia prima Equipo 1
            </button>
            <button onclick="askExample('¿Cuál es la proyección del Equipo 2?')">
                Proyección Equipo 2
            </button>
        </section>

        <section class="chat-box" id="chatBox"></section>

        <section class="input-area">
            <textarea id="questionInput" placeholder="Escribe tu pregunta..."></textarea>
            <button onclick="sendQuestion()">Enviar</button>
        </section>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
